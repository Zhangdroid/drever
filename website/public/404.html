<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f3e9" />
    <title>Page not found — Drever</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f6f3e9;
        color: #19172b;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(36rem, calc(100% - 3rem));
      }

      a {
        color: inherit;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }

      h1 {
        margin: 1.5rem 0 0.75rem;
        font-size: clamp(3rem, 10vw, 6rem);
        line-height: 0.95;
        letter-spacing: -0.05em;
      }

      p {
        margin: 0;
        color: #59566b;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Drever</a>
      <h1>Page not found.</h1>
      <p>The page you requested does not exist.</p>
    </main>
  </body>
</html>
