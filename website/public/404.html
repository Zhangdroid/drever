<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f6f3e9" />
    <title>Page not found — Drever</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Instrument Sans", "SF Pro Text", system-ui, sans-serif;
        background: #f6f3e9;
        color: #19172b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        position: relative;
        width: min(42rem, 100%);
        padding: clamp(2rem, 7vw, 5rem);
        border-left: 0.55rem solid #c7f03a;
        background: #fffdf7;
        box-shadow: 0 2rem 6rem rgb(25 23 43 / 10%);
      }

      main::after {
        position: absolute;
        top: 2rem;
        right: 2rem;
        width: 2.8rem;
        height: 0.3rem;
        background: #5b45d8;
        content: "";
      }

      a {
        color: inherit;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-decoration: none;
        text-transform: uppercase;
      }

      h1 {
        max-width: 8ch;
        margin: 4rem 0 1rem;
        font-size: clamp(3.6rem, 12vw, 7rem);
        font-weight: 650;
        letter-spacing: -0.065em;
        line-height: 0.86;
      }

      p {
        max-width: 32rem;
        margin: 0;
        color: #686474;
        line-height: 1.6;
      }

      nav {
        margin-block-start: 2rem;
      }

      nav a {
        display: inline-block;
        padding: 0.85rem 1rem;
        border-radius: 0.6rem;
        background: #19172b;
        color: #f6f3e9;
        letter-spacing: 0;
        text-transform: none;
      }
    </style>
  </head>
  <body>
    <main>
      <a href="/">Drever</a>
      <h1>That slide is not here.</h1>
      <p>The route may have moved, or this presentation state does not exist.</p>
      <nav><a href="/">Return home →</a></nav>
    </main>
  </body>
</html>
