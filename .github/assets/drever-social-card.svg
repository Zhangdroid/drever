<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @font-face {
        font-family: "Bricolage Grotesque";
        font-style: normal;
        font-weight: 200 800;
        src: url("../../packages/brand/fonts/BricolageGrotesque-Latin[opsz,wdth,wght].woff2")
          format("woff2-variations");
      }

      @font-face {
        font-family: "Instrument Sans";
        font-style: normal;
        font-weight: 400 700;
        src: url("../../packages/brand/fonts/InstrumentSans[wdth,wght].woff2")
          format("woff2-variations");
      }

      .display {
        font-family: "Bricolage Grotesque", "Instrument Sans", sans-serif;
        font-variation-settings:
          "opsz" 88,
          "wdth" 100,
          "wght" 640;
      }

      .sans {
        font-family: "Instrument Sans", sans-serif;
        font-variation-settings:
          "wdth" 100,
          "wght" 520;
      }

      .label {
        font-family: "Instrument Sans", sans-serif;
        font-size: 13px;
        font-variation-settings:
          "wdth" 100,
          "wght" 680;
        letter-spacing: 1.8px;
      }
    </style>

    <filter id="stage-shadow" x="-25%" y="-25%" width="150%" height="170%">
      <feDropShadow dx="0" dy="18" flood-color="#19172B" flood-opacity=".14" stdDeviation="22" />
    </filter>

    <linearGradient id="glass" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".78" />
      <stop offset="1" stop-color="#E9E4FF" stop-opacity=".5" />
    </linearGradient>

    <radialGradient id="signal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C7F03A" stop-opacity=".36" />
      <stop offset="1" stop-color="#C7F03A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="continuity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5B45D8" stop-opacity=".2" />
      <stop offset="1" stop-color="#5B45D8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#F6F3E9" />
  <circle cx="1076" cy="82" r="260" fill="url(#continuity-glow)" />
  <circle cx="607" cy="610" r="260" fill="url(#signal-glow)" />

  <g transform="translate(72 56)">
    <g transform="scale(1.22)">
      <path fill="#C7F03A" d="M4 13h12v6H4zm16 0h12v6H20z" />
      <path fill="#19172B" d="M36 13h22v39H6V30h8v14h36V21H36z" />
    </g>
    <text class="display" x="84" y="48" fill="#19172B" font-size="48" letter-spacing="-1.7">
      drever
    </text>
  </g>

  <g transform="translate(72 190)">
    <text class="label" fill="#5B45D8" x="0" y="0">LOCAL PRESENTATION STUDIO</text>

    <text class="display" fill="#19172B" font-size="68" letter-spacing="-3.2" x="0" y="96">
      Your agent drafts.
    </text>
    <rect x="-4" y="114" width="332" height="68" rx="3" fill="#C7F03A" />
    <text class="display" fill="#19172B" font-size="68" letter-spacing="-3.2" x="7" y="171">
      You direct.
    </text>

    <text class="sans" fill="#686474" font-size="20" x="2" y="228">
      Approve the story. Shape the live draft.
    </text>
    <text class="sans" fill="#686474" font-size="20" x="2" y="258">
      Ship checked slides from files you own.
    </text>
  </g>

  <g transform="translate(666 92)">
    <rect
      width="452"
      height="430"
      x="-22"
      y="24"
      rx="22"
      fill="url(#glass)"
      stroke="#FFFFFF"
      stroke-opacity=".82"
    />
    <rect width="452" height="430" rx="18" fill="#19172B" filter="url(#stage-shadow)" />

    <g transform="translate(26 34)">
      <text class="label" fill="#F6F3E9" x="0" y="0">DREVER STUDIO</text>
      <circle cx="316" cy="-4" r="5" fill="#5B45D8" />
      <text class="label" fill="#B9B3C7" x="329" y="0">AGENT ACTIVE</text>

      <g transform="translate(0 30)">
        <circle cx="7" cy="6" r="7" fill="#C7F03A" />
        <text class="label" fill="#F6F3E9" x="23" y="11">BRIEF</text>
        <line x1="91" x2="117" y1="6" y2="6" stroke="#4A4658" />
        <circle cx="128" cy="6" r="7" fill="#C7F03A" />
        <text class="label" fill="#F6F3E9" x="144" y="11">STORY</text>
        <line x1="218" x2="244" y1="6" y2="6" stroke="#4A4658" />
        <circle cx="255" cy="6" r="7" fill="#5B45D8" />
        <text class="label" fill="#F6F3E9" x="271" y="11">DRAFT</text>
      </g>

      <g transform="translate(0 76)">
        <rect width="266" height="218" rx="12" fill="#F6F3E9" />
        <rect width="266" height="218" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity=".22" />
        <text class="label" fill="#5B45D8" x="20" y="31">LIVE DRAFT · 05</text>
        <text class="display" fill="#19172B" font-size="35" letter-spacing="-1.8" x="20" y="88">
          One clear
        </text>
        <rect x="18" y="102" width="180" height="38" rx="2" fill="#C7F03A" />
        <text class="display" fill="#19172B" font-size="36" letter-spacing="-1.8" x="24" y="134">
          decision.
        </text>
        <line x1="20" x2="219" y1="166" y2="166" stroke="#D8D2C5" />
        <line x1="20" x2="162" y1="183" y2="183" stroke="#D8D2C5" />
        <circle cx="228" cy="182" r="15" fill="#5B45D8" />
        <path d="M223 182l4 4 8-10" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
      </g>

      <g transform="translate(282 110)">
        <rect width="118" height="154" rx="12" fill="#EEE9FF" stroke="#7B66EA" stroke-opacity=".5" />
        <text class="label" fill="#5B45D8" x="14" y="28">YOU</text>
        <line x1="14" x2="94" y1="53" y2="53" stroke="#5B45D8" stroke-opacity=".34" stroke-width="5" />
        <line x1="14" x2="82" y1="72" y2="72" stroke="#5B45D8" stroke-opacity=".22" stroke-width="5" />
        <line x1="14" x2="66" y1="91" y2="91" stroke="#5B45D8" stroke-opacity=".22" stroke-width="5" />
        <path d="M16 124h78" stroke="#C7F03A" stroke-width="4" />
        <circle cx="94" cy="124" r="6" fill="#C7F03A" />
      </g>

      <g transform="translate(0 320)">
        <rect width="400" height="52" rx="10" fill="#23212F" stroke="#C7F03A" stroke-opacity=".28" />
        <circle cx="22" cy="26" r="6" fill="#C7F03A" />
        <text class="label" fill="#F6F3E9" x="38" y="31">RENDERED REVIEW</text>
        <text class="label" fill="#C7F03A" text-anchor="end" x="380" y="31">READY</text>
      </g>
    </g>
  </g>

  <g transform="translate(72 570)">
    <rect width="26" height="6" fill="#C7F03A" />
    <rect x="36" width="26" height="6" fill="#C7F03A" />
    <path d="M74 3H1010" fill="none" stroke="#5B45D8" stroke-width="2" />
    <circle cx="1010" cy="3" r="5" fill="#F6F3E9" stroke="#5B45D8" stroke-width="2" />
    <text class="label" fill="#686474" text-anchor="end" x="1056" y="31">DREVER.DEV</text>
  </g>
</svg>
