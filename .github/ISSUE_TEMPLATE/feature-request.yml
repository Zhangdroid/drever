name: Feature request
description: Propose a concrete improvement to Drever.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What presentation workflow is difficult today, and who does it affect?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe what should become possible without prescribing the implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Possible approach
      description: Share an API, interaction, example, or alternative if you have one.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the roadmap for related work.
          required: true
