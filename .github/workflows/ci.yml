name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check source
        run: vp check

      - name: Check public Vite types
        run: vp exec tsc -p packages/vite/type-tests/tsconfig.json

      - name: Run unit tests
        run: vp run test

      - name: Verify release tarballs and a clean consumer
        run: vp run release:check

      - name: Install Chromium
        run: vp exec playwright install --with-deps chromium

      - name: Refresh workspace executables
        run: vp install --frozen-lockfile

      - name: Run core end-to-end tests
        run: vp run test:e2e:core

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-diagnostics-${{ github.run_attempt }}
          path: .drever/e2e
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
