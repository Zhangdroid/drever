name: Full end-to-end tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: full-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: All presentation surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Build workspace packages
        run: vp run build:packages

      - name: Run every end-to-end project
        run: vp run test:e2e

      - name: Upload end-to-end diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-playwright-diagnostics-${{ github.run_attempt }}
          path: .drever/e2e
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
