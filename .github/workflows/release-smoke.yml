name: AI release smoke recovery · 0.9.0

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-release-smoke-recovery-30321747285
  cancel-in-progress: false

env:
  RELEASE_SMOKE_SOURCE_COMMIT: 59554ca48cc132f3630bb9cf18c5673524ec1033
  RELEASE_SMOKE_VERSION: 0.9.0
  SOURCE_RUN_ID: "30321747285"

jobs:
  repair-build:
    name: Repair and build · Claude · guided
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      actions: read
      contents: read
    env:
      BUILT_ROOT: ${{ github.workspace }}/release-smoke-work/built
      GENERATED_ROOT: ${{ github.workspace }}/release-smoke-work/generated
      RELEASE_SMOKE_BUILD_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
    steps:
      - name: Check out the recovery harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the browser smoke harness
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Pull the isolated build image
        run: docker pull "$RELEASE_SMOKE_BUILD_IMAGE"

      - name: Download the original Claude guided source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-generated-claude-guided-30321747285
          path: ${{ env.GENERATED_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30321747285

      - name: Repair the duplicate slide heading and record provenance
        run: >
          node scripts/release-smoke/recover-generated-title.mjs
          "$GENERATED_ROOT"

      - name: Build and verify the repaired case without provider secrets
        run: >
          node scripts/release-smoke/build-case.mjs
          "$RELEASE_SMOKE_VERSION"
          "claude"
          "guided"
          "$SOURCE_RUN_ID"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GENERATED_ROOT"
          "$BUILT_ROOT"

      - name: Attach the repair disclosure to the published case
        run: >
          node scripts/release-smoke/disclose-recovery.mjs
          "$GENERATED_ROOT"
          "$BUILT_ROOT/claude-guided"

      - name: Upload the repaired interactive result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-built-claude-guided-recovery-${{ github.run_id }}
          path: ${{ env.BUILT_ROOT }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish recovered review deployment
    needs: repair-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    env:
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: drever-release-smoke
      RESULT_BRANCH: run-30321747285
      RESULT_SUMMARY: ${{ github.workspace }}/release-smoke-work/result-summary.md
      RESULTS_ROOT: ${{ github.workspace }}/release-smoke-work/results
    steps:
      - name: Check out the recovery harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the review site toolchain
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp install --frozen-lockfile

      - name: Download original Codex surprise-me result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-built-codex-surprise-me-30321747285
          path: ${{ env.RESULTS_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30321747285

      - name: Download original Codex guided result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-built-codex-guided-30321747285
          path: ${{ env.RESULTS_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30321747285

      - name: Download original Claude surprise-me result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-built-claude-surprise-me-30321747285
          path: ${{ env.RESULTS_ROOT }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30321747285

      - name: Download repaired Claude guided result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-built-claude-guided-recovery-${{ github.run_id }}
          path: ${{ env.RESULTS_ROOT }}

      - name: Require exactly four complete cases
        run: |
          test -f "$RESULTS_ROOT/codex-surprise-me/case.json"
          test -f "$RESULTS_ROOT/codex-guided/case.json"
          test -f "$RESULTS_ROOT/claude-surprise-me/case.json"
          test -f "$RESULTS_ROOT/claude-guided/case.json"

      - name: Hydrate the published release history
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/hydrate-history.mjs"
          "$AUTOMATION_ROOT/website"
          "https://drever-release-smoke.pages.dev"
          "https://3cc63cd1.drever-website.pages.dev"

      - name: Assemble the original report ID
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/publish-results.mjs"
          "$RELEASE_SMOKE_VERSION"
          "$SOURCE_RUN_ID"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GITHUB_REPOSITORY"
          "$RESULTS_ROOT"
          "$AUTOMATION_ROOT/website"
          "$RESULT_BRANCH"
          "release"
          "${{ github.sha }}"
          "$RESULT_SUMMARY"

      - name: Add public recovery provenance
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/disclose-recovered-run.mjs"
          "$AUTOMATION_ROOT/website"
          "$RESULTS_ROOT"
          "$RESULT_SUMMARY"

      - name: Build the isolated review site
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp run -F @drever/website build

      - name: Upload the immutable deck deployment
        id: deck
        run: |
          origin="$(
            node "$AUTOMATION_ROOT/scripts/release-smoke/deploy-pages.mjs" \
              "$AUTOMATION_ROOT/website/dist/client" \
              "$PAGES_PROJECT" \
              "$RESULT_BRANCH" \
              "${{ github.sha }}" \
              "Drever $RELEASE_SMOKE_VERSION · recovered run $SOURCE_RUN_ID"
          )"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Pin the result to the immutable preview
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-preview-origin.mjs"
          "$AUTOMATION_ROOT/website"
          "$SOURCE_RUN_ID"
          "$RESULT_BRANCH"
          "${{ steps.deck.outputs.origin }}"
          "$RESULT_SUMMARY"

      - name: Rebuild the report with immutable deck links
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp run -F @drever/website build

      - name: Upload the latest report deployment
        id: report
        run: |
          origin="$(
            node "$AUTOMATION_ROOT/scripts/release-smoke/deploy-pages.mjs" \
              "$AUTOMATION_ROOT/website/dist/client" \
              "$PAGES_PROJECT" \
              "main" \
              "${{ github.sha }}" \
              "Drever $RELEASE_SMOKE_VERSION · recovered report"
          )"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Verify the recovered report deployment
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/verify-pages-preview.mjs"
          "${{ steps.report.outputs.origin }}"
          "${{ steps.deck.outputs.origin }}"
          "$SOURCE_RUN_ID"
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "${{ github.sha }}"

      - name: Pin the review report link
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-report-link.mjs"
          "$RESULT_SUMMARY"
          "${{ steps.deck.outputs.origin }}"
          "${{ steps.report.outputs.origin }}"

      - name: Retain the recovered site bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-site-recovery-${{ github.run_id }}
          path: ${{ env.AUTOMATION_ROOT }}/website/dist/client
          if-no-files-found: error
          retention-days: 30

      - name: Update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/record-release-link.mjs"
          "$GITHUB_REPOSITORY"
          "$RELEASE_SMOKE_VERSION"
          "${{ steps.report.outputs.origin }}"
          "https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}"

      - name: Publish the recovery summary
        run: |
          cat "$RESULT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable report: [\`${{ steps.report.outputs.origin }}\`](${{ steps.report.outputs.origin }}/release-smoke/)" >> "$GITHUB_STEP_SUMMARY"
