name: AI release smoke

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit recorded by the GitHub release
        required: true
        type: string
      version:
        description: Exact published Drever version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-release-smoke-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the immutable workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Match npm, GitHub release, tag, and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_SMOKE_VERSION: ${{ inputs.version }}
          TRUSTED_WORKFLOW_REF: ${{ github.ref }}
        run: >
          node scripts/release-smoke/verify-provenance.mjs
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GITHUB_REPOSITORY"
          "$TRUSTED_WORKFLOW_REF"

  resolve_agents:
    name: Resolve stable agent CLIs
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      claude_version: ${{ steps.versions.outputs.claude_version }}
      codex_version: ${{ steps.versions.outputs.codex_version }}
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Resolve each release channel once
        id: versions
        run: |
          codex_version="$(npm view @openai/codex@latest version)"
          claude_version="$(npm view @anthropic-ai/claude-code@stable version)"
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$codex_version" =~ $version_pattern ]]; then
            echo "npm returned an invalid Codex CLI version: $codex_version" >&2
            exit 1
          fi
          if [[ ! "$claude_version" =~ $version_pattern ]]; then
            echo "npm returned an invalid Claude Code CLI version: $claude_version" >&2
            exit 1
          fi
          echo "codex_version=$codex_version" >> "$GITHUB_OUTPUT"
          echo "claude_version=$claude_version" >> "$GITHUB_OUTPUT"
          echo "Resolved Codex $codex_version and Claude Code $claude_version."

  authorize:
    name: Approve AI smoke budget
    needs: verify
    environment: ai-release-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Authorize all four AI journeys and bounded repairs
        run: echo "The protected environment authorized this release-smoke run."

  prepare:
    name: Prepare · ${{ matrix.provider }} · ${{ matrix.case }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.provider }}-${{ matrix.case }}/artifact
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      PREPARED_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.provider }}-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.provider }}-${{ matrix.case }}/project
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      SCAFFOLD_ROOT: ${{ github.workspace }}/release-smoke-work/scaffold-${{ matrix.provider }}-${{ matrix.case }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Scaffold the exact release and cache the public prompt
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/prepare-project.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$SCAFFOLD_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Upload the inert authoring context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-prepared-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.PREPARED_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  generate:
    name: Generate · ${{ matrix.provider }} · ${{ matrix.case }}
    needs:
      - authorize
      - prepare
      - resolve_agents
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/active-${{ matrix.provider }}-${{ matrix.case }}/artifact
      CLAUDE_CLI_VERSION: ${{ needs.resolve_agents.outputs.claude_version }}
      CLAUDE_CLI_ROOT: ${{ github.workspace }}/release-smoke-work/claude-cli
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/release-smoke-work/claude-${{ matrix.case }}
      CODEX_CLI_VERSION: ${{ needs.resolve_agents.outputs.codex_version }}
      CODEX_HOME: ${{ github.workspace }}/release-smoke-work/codex-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/active-${{ matrix.provider }}-${{ matrix.case }}/project
      QUARANTINE_ROOT: ${{ github.workspace }}/release-smoke-work/quarantine-${{ matrix.provider }}-${{ matrix.case }}
      RELEASE_SMOKE_GENERATION_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_MODEL: ${{ matrix.provider == 'claude' && 'claude-opus-5' || 'gpt-5.6-sol' }}
      RELEASE_SMOKE_RUN_ID: ${{ github.run_id }}
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      RELEASE_SMOKE_WORK_ROOT: ${{ github.workspace }}/release-smoke-work
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Download inert authoring context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-prepared-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.QUARANTINE_ROOT }}

      - name: Rebuild the authoring context from regular allowlisted files
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/activate-handoff.mjs"
          "${{ matrix.provider }}"
          "$QUARANTINE_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Start the protected Codex proxy
        if: matrix.provider == 'codex'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bots: true
          codex-version: ${{ env.CODEX_CLI_VERSION }}
          codex-home: ${{ env.CODEX_HOME }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          working-directory: ${{ env.PROJECT_ROOT }}

      - name: Install the resolved Claude Code CLI
        if: matrix.provider == 'claude'
        run: |
          npm install --global --prefix "$CLAUDE_CLI_ROOT" "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          docker pull "$RELEASE_SMOKE_GENERATION_IMAGE"

      - name: Run the Codex creation journey
        if: matrix.provider == 'codex'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Run the Claude creation journey
        if: matrix.provider == 'claude'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Upload allowlisted source and sanitized conversation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-generated-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  validate:
    name: Validate · ${{ matrix.provider }} · ${{ matrix.case }}
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      VALIDATION_ROOT: ${{ github.workspace }}/release-smoke-work/validation
      GENERATED_ROOT: ${{ github.workspace }}/release-smoke-work/generated
      RELEASE_SMOKE_BUILD_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the browser smoke harness
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Pull the isolated build image
        run: docker pull "$RELEASE_SMOKE_BUILD_IMAGE"

      - name: Download generated source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-generated-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.GENERATED_ROOT }}

      - name: Check, build, capture visual evidence, and open every surface without a model secret
        run: >
          node scripts/release-smoke/validate-case.mjs
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GENERATED_ROOT"
          "$VALIDATION_ROOT"

      - name: Upload validation evidence and any passing build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-validation-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.VALIDATION_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  repair:
    name: First refinement · ${{ matrix.provider }} · ${{ matrix.case }}
    needs:
      - authorize
      - resolve_agents
      - validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/candidate-${{ matrix.provider }}-${{ matrix.case }}
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      CLAUDE_CLI_VERSION: ${{ needs.resolve_agents.outputs.claude_version }}
      CLAUDE_CLI_ROOT: ${{ github.workspace }}/release-smoke-work/claude-cli
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/release-smoke-work/claude-repair-${{ matrix.case }}
      CODEX_CLI_VERSION: ${{ needs.resolve_agents.outputs.codex_version }}
      CODEX_HOME: ${{ github.workspace }}/release-smoke-work/codex-repair-${{ matrix.case }}
      ORIGINAL_ROOT: ${{ github.workspace }}/release-smoke-work/original-${{ matrix.provider }}-${{ matrix.case }}
      PREPARED_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.provider }}-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/repair-${{ matrix.provider }}-${{ matrix.case }}/project
      QUARANTINE_ROOT: ${{ github.workspace }}/release-smoke-work/quarantine-${{ matrix.provider }}-${{ matrix.case }}
      RELEASE_SMOKE_GENERATION_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_MODEL: ${{ matrix.provider == 'claude' && 'claude-opus-5' || 'gpt-5.6-sol' }}
      RELEASE_SMOKE_RUN_ID: ${{ github.run_id }}
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      RELEASE_SMOKE_WORK_ROOT: ${{ github.workspace }}/release-smoke-work
      VALIDATION_ROOT: ${{ github.workspace }}/release-smoke-work/validation-${{ matrix.provider }}-${{ matrix.case }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Download original source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-generated-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ORIGINAL_ROOT }}

      - name: Download validation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-validation-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.VALIDATION_ROOT }}

      - name: Verify the validation decision
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/read-validation-status.mjs"
          "$VALIDATION_ROOT/validation.json"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "${{ github.run_id }}"
          "${{ inputs.source_commit }}"

      - name: Download inert authoring context for refinement
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-prepared-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.QUARANTINE_ROOT }}

      - name: Rebuild one refinement context from allowlisted files
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/activate-repair.mjs"
          "${{ matrix.provider }}"
          "$QUARANTINE_ROOT"
          "$ORIGINAL_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT"

      - name: Start the protected Codex refinement proxy
        if: matrix.provider == 'codex'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bots: true
          codex-version: ${{ env.CODEX_CLI_VERSION }}
          codex-home: ${{ env.CODEX_HOME }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          working-directory: ${{ env.PROJECT_ROOT }}

      - name: Install the resolved Claude Code CLI for refinement
        if: matrix.provider == 'claude'
        run: |
          npm install --global --prefix "$CLAUDE_CLI_ROOT" "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          docker pull "$RELEASE_SMOKE_GENERATION_IMAGE"

      - name: Run one Codex refinement turn
        if: matrix.provider == 'codex'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT/validation.json"

      - name: Run one Claude refinement turn
        if: matrix.provider == 'claude'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT/validation.json"

      - name: Upload the initially refined candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-candidate-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  review_validate:
    name: Render refined source · ${{ matrix.provider }} · ${{ matrix.case }}
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      CANDIDATE_ROOT: ${{ github.workspace }}/release-smoke-work/candidate
      RELEASE_SMOKE_BUILD_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      VALIDATION_ROOT: ${{ github.workspace }}/release-smoke-work/review-validation
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the initially refined candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-candidate-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.CANDIDATE_ROOT }}

      - name: Set up Vite+ for rendered review
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the browser smoke harness for rendered review
        run: vp install --frozen-lockfile

      - name: Install Chromium for rendered review
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Pull the isolated build image for rendered review
        run: docker pull "$RELEASE_SMOKE_BUILD_IMAGE"

      - name: Recheck, rebuild, and capture the refined source without a model secret
        run: >
          node scripts/release-smoke/validate-case.mjs
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$CANDIDATE_ROOT"
          "$VALIDATION_ROOT"

      - name: Require complete rendered evidence
        run: |
          stage="$(
            node scripts/release-smoke/read-review-stage.mjs \
              "$CANDIDATE_ROOT/generation.json" \
              "$VALIDATION_ROOT/validation.json" \
              "$RELEASE_SMOKE_VERSION" \
              "${{ matrix.provider }}" \
              "${{ matrix.case }}" \
              "${{ github.run_id }}" \
              "$RELEASE_SMOKE_SOURCE_COMMIT"
          )"
          echo "Rendered review stage: $stage"

      - name: Upload rendered evidence for final visual review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-review-validation-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.VALIDATION_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  visual_review:
    name: Final visual review · ${{ matrix.provider }} · ${{ matrix.case }}
    needs:
      - authorize
      - repair
      - resolve_agents
      - review_validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/reviewed-${{ matrix.provider }}-${{ matrix.case }}
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      CLAUDE_CLI_VERSION: ${{ needs.resolve_agents.outputs.claude_version }}
      CLAUDE_CLI_ROOT: ${{ github.workspace }}/release-smoke-work/claude-cli
      CLAUDE_CONFIG_DIR: ${{ github.workspace }}/release-smoke-work/claude-visual-${{ matrix.case }}
      CODEX_CLI_VERSION: ${{ needs.resolve_agents.outputs.codex_version }}
      CODEX_HOME: ${{ github.workspace }}/release-smoke-work/codex-visual-${{ matrix.case }}
      ORIGINAL_ROOT: ${{ github.workspace }}/release-smoke-work/candidate-${{ matrix.provider }}-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/visual-${{ matrix.provider }}-${{ matrix.case }}/project
      QUARANTINE_ROOT: ${{ github.workspace }}/release-smoke-work/quarantine-${{ matrix.provider }}-${{ matrix.case }}
      RELEASE_SMOKE_GENERATION_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_MODEL: ${{ matrix.provider == 'claude' && 'claude-opus-5' || 'gpt-5.6-sol' }}
      RELEASE_SMOKE_RUN_ID: ${{ github.run_id }}
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      RELEASE_SMOKE_WORK_ROOT: ${{ github.workspace }}/release-smoke-work
      VALIDATION_ROOT: ${{ github.workspace }}/release-smoke-work/review-validation-${{ matrix.provider }}-${{ matrix.case }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Download the initially refined candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-candidate-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ORIGINAL_ROOT }}

      - name: Download the rendered review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-review-validation-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.VALIDATION_ROOT }}

      - name: Read the candidate review stage
        id: stage
        run: |
          stage="$(
            node "$AUTOMATION_ROOT/scripts/release-smoke/read-review-stage.mjs" \
              "$ORIGINAL_ROOT/generation.json" \
              "$VALIDATION_ROOT/validation.json" \
              "$RELEASE_SMOKE_VERSION" \
              "${{ matrix.provider }}" \
              "${{ matrix.case }}" \
              "${{ github.run_id }}" \
              "${{ inputs.source_commit }}"
          )"
          echo "stage=$stage" >> "$GITHUB_OUTPUT"

      - name: Download inert authoring context for the required visual review
        if: steps.stage.outputs.stage == 'required'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-prepared-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.QUARANTINE_ROOT }}

      - name: Rebuild the required visual-review context from allowlisted files
        if: steps.stage.outputs.stage == 'required'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/activate-repair.mjs"
          "${{ matrix.provider }}"
          "$QUARANTINE_ROOT"
          "$ORIGINAL_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT"

      - name: Start the protected Codex visual-review proxy
        if: steps.stage.outputs.stage == 'required' && matrix.provider == 'codex'
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bots: true
          codex-version: ${{ env.CODEX_CLI_VERSION }}
          codex-home: ${{ env.CODEX_HOME }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          working-directory: ${{ env.PROJECT_ROOT }}

      - name: Install the resolved Claude Code CLI for visual review
        if: steps.stage.outputs.stage == 'required' && matrix.provider == 'claude'
        run: |
          npm install --global --prefix "$CLAUDE_CLI_ROOT" "@anthropic-ai/claude-code@$CLAUDE_CLI_VERSION"
          docker pull "$RELEASE_SMOKE_GENERATION_IMAGE"

      - name: Run one Codex visual-review turn
        if: steps.stage.outputs.stage == 'required' && matrix.provider == 'codex'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT/validation.json"

      - name: Run one Claude visual-review turn
        if: steps.stage.outputs.stage == 'required' && matrix.provider == 'claude'
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"
          "$VALIDATION_ROOT/validation.json"

      - name: Retain the already visually reviewed candidate
        if: steps.stage.outputs.stage == 'complete'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-reviewed-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ORIGINAL_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Retain the newly visually reviewed candidate
        if: steps.stage.outputs.stage == 'required'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-reviewed-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  final_build:
    name: Final build · ${{ matrix.provider }} · ${{ matrix.case }}
    needs: visual_review
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        provider:
          - codex
          - claude
        case:
          - surprise-me
          - guided
    env:
      BUILT_ROOT: ${{ github.workspace }}/release-smoke-work/built
      CANDIDATE_ROOT: ${{ github.workspace }}/release-smoke-work/candidate
      RELEASE_SMOKE_BUILD_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Download the completed visual-review candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-reviewed-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.CANDIDATE_ROOT }}

      - name: Set up Vite+ for reviewed source
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the browser smoke harness for reviewed source
        run: vp install --frozen-lockfile

      - name: Install Chromium for reviewed source
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Pull the isolated build image for reviewed source
        run: docker pull "$RELEASE_SMOKE_BUILD_IMAGE"

      - name: Recheck and rebuild visually reviewed source without a model secret
        run: >
          node scripts/release-smoke/build-case.mjs
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.provider }}"
          "${{ matrix.case }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$CANDIDATE_ROOT"
          "$BUILT_ROOT"

      - name: Upload the final interactive result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-built-${{ matrix.provider }}-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.BUILT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  publish:
    name: Publish review deployment
    needs: final_build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      PAGES_PROJECT: drever-release-smoke
      RESULT_SUMMARY: ${{ github.workspace }}/release-smoke-work/result-summary.md
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      RESULTS_ROOT: ${{ github.workspace }}/release-smoke-work/results
      RESULT_BRANCH: run-${{ github.run_id }}
    steps:
      - name: Check out the automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the review site toolchain
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp install --frozen-lockfile

      - name: Download the built presentations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-smoke-built-*-${{ github.run_id }}
          path: ${{ env.RESULTS_ROOT }}
          merge-multiple: true

      - name: Hydrate the published release history
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/hydrate-history.mjs"
          "$AUTOMATION_ROOT/website"
          "https://drever-release-smoke.pages.dev"
          "https://3cc63cd1.drever-website.pages.dev"

      - name: Assemble the website data and review summary
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/publish-results.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GITHUB_REPOSITORY"
          "$RESULTS_ROOT"
          "$AUTOMATION_ROOT/website"
          "$RESULT_BRANCH"
          "release"
          "${{ github.sha }}"
          "$RESULT_SUMMARY"

      - name: Build the isolated review site
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp run -F @drever/website build

      - name: Upload the immutable deck deployment
        id: deck
        run: |
          origin="$(
            node "$AUTOMATION_ROOT/scripts/release-smoke/deploy-pages.mjs" \
              "$AUTOMATION_ROOT/website/dist/client" \
              "$PAGES_PROJECT" \
              "$RESULT_BRANCH" \
              "${{ github.sha }}" \
              "Drever $RELEASE_SMOKE_VERSION · run ${{ github.run_id }}"
          )"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Pin the result to the immutable preview
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-preview-origin.mjs"
          "$AUTOMATION_ROOT/website"
          "${{ github.run_id }}"
          "$RESULT_BRANCH"
          "${{ steps.deck.outputs.origin }}"
          "$RESULT_SUMMARY"

      - name: Rebuild the report with immutable deck links
        working-directory: ${{ env.AUTOMATION_ROOT }}
        run: vp run -F @drever/website build

      - name: Upload the latest report deployment
        id: report
        run: |
          origin="$(
            node "$AUTOMATION_ROOT/scripts/release-smoke/deploy-pages.mjs" \
              "$AUTOMATION_ROOT/website/dist/client" \
              "$PAGES_PROJECT" \
              "main" \
              "${{ github.sha }}" \
              "Drever $RELEASE_SMOKE_VERSION · verified report"
          )"
          echo "origin=$origin" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable report deployment
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/verify-pages-preview.mjs"
          "${{ steps.report.outputs.origin }}"
          "${{ steps.deck.outputs.origin }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "${{ github.sha }}"

      - name: Pin the review report link
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-report-link.mjs"
          "$RESULT_SUMMARY"
          "${{ steps.deck.outputs.origin }}"
          "${{ steps.report.outputs.origin }}"

      - name: Retain a downloadable site bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-site-${{ github.run_id }}
          path: ${{ env.AUTOMATION_ROOT }}/website/dist/client
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Add the immutable report to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/record-release-link.mjs"
          "$GITHUB_REPOSITORY"
          "$RELEASE_SMOKE_VERSION"
          "${{ steps.report.outputs.origin }}"
          "https://github.com/$GITHUB_REPOSITORY/actions/runs/${{ github.run_id }}"

      - name: Publish the review summary
        run: |
          cat "$RESULT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Immutable report: [\`${{ steps.report.outputs.origin }}\`](${{ steps.report.outputs.origin }}/release-smoke/)" >> "$GITHUB_STEP_SUMMARY"
