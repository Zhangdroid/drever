name: AI release smoke

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact source commit recorded by the GitHub release
        required: true
        type: string
      version:
        description: Exact published Drever version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ai-release-smoke-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out the immutable workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Match npm, GitHub release, tag, and source commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          RELEASE_SMOKE_VERSION: ${{ inputs.version }}
          TRUSTED_WORKFLOW_REF: ${{ github.ref }}
        run: >
          node scripts/release-smoke/verify-provenance.mjs
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GITHUB_REPOSITORY"
          "$TRUSTED_WORKFLOW_REF"

  prepare:
    name: Prepare · ${{ matrix.case }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case:
          - surprise-me
          - guided
    env:
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.case }}/artifact
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      PREPARED_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/prepared-${{ matrix.case }}/project
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      SCAFFOLD_ROOT: ${{ github.workspace }}/release-smoke-work/scaffold-${{ matrix.case }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Scaffold the exact release and cache the public prompt
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/prepare-project.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.case }}"
          "$SCAFFOLD_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Upload the inert authoring context
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-prepared-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.PREPARED_ROOT }}
          if-no-files-found: error
          include-hidden-files: true
          overwrite: true
          retention-days: 1

  generate:
    name: Generate · ${{ matrix.case }}
    needs: prepare
    environment: ai-release-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case:
          - surprise-me
          - guided
    env:
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      ARTIFACT_ROOT: ${{ github.workspace }}/release-smoke-work/active-${{ matrix.case }}/artifact
      CODEX_HOME: ${{ github.workspace }}/release-smoke-work/codex-${{ matrix.case }}
      PROJECT_ROOT: ${{ github.workspace }}/release-smoke-work/active-${{ matrix.case }}/project
      QUARANTINE_ROOT: ${{ github.workspace }}/release-smoke-work/quarantine-${{ matrix.case }}
      RELEASE_SMOKE_MODEL: gpt-5.4-mini
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Download inert authoring context
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-prepared-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.QUARANTINE_ROOT }}

      - name: Rebuild the authoring context from regular allowlisted files
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/activate-handoff.mjs"
          "$QUARANTINE_ROOT"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Start the protected Codex proxy
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          allow-bots: true
          codex-version: 0.145.0
          codex-home: ${{ env.CODEX_HOME }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          working-directory: ${{ env.PROJECT_ROOT }}

      - name: Run the multi-turn creation journey
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/run-session.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.case }}"
          "$PROJECT_ROOT"
          "$ARTIFACT_ROOT"

      - name: Upload allowlisted source and sanitized conversation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-generated-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  build:
    name: Build · ${{ matrix.case }}
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        case:
          - surprise-me
          - guided
    env:
      BUILT_ROOT: ${{ github.workspace }}/release-smoke-work/built
      GENERATED_ROOT: ${{ github.workspace }}/release-smoke-work/generated
      RELEASE_SMOKE_BUILD_IMAGE: node@sha256:d45d78e7929b46875bbd4e29bea672d5bc48186c6c3588306521c815e78352d6
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out the trusted automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: true
          run-install: false

      - name: Install the browser smoke harness
        run: vp install --frozen-lockfile

      - name: Install Chromium
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Pull the isolated build image
        run: docker pull "$RELEASE_SMOKE_BUILD_IMAGE"

      - name: Download generated source
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-smoke-generated-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.GENERATED_ROOT }}

      - name: Build and open every presentation surface without the API secret
        run: >
          node scripts/release-smoke/build-case.mjs
          "$RELEASE_SMOKE_VERSION"
          "${{ matrix.case }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GENERATED_ROOT"
          "$BUILT_ROOT"

      - name: Upload the interactive result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-smoke-built-${{ matrix.case }}-${{ github.run_id }}
          path: ${{ env.BUILT_ROOT }}
          if-no-files-found: error
          overwrite: true
          retention-days: 30

  propose:
    name: Publish website results
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      checks: read
      contents: write
    env:
      AUTOMATION_ROOT: ${{ github.workspace }}/automation
      RESULT_SUMMARY: ${{ github.workspace }}/release-smoke-work/result-summary.md
      RELEASE_SMOKE_SOURCE_COMMIT: ${{ inputs.source_commit }}
      RELEASE_SMOKE_VERSION: ${{ inputs.version }}
      REPOSITORY_ROOT: ${{ github.workspace }}/repository
      RESULTS_ROOT: ${{ github.workspace }}/release-smoke-work/results
      RESULT_BRANCH: automation-release-smoke-${{ github.run_id }}
    steps:
      - name: Check out the automation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: automation
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Check out main for the result proposal
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Download the built presentations
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-smoke-built-*-${{ github.run_id }}
          path: ${{ env.RESULTS_ROOT }}
          merge-multiple: true

      - name: Assemble the website data and review summary
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/publish-results.mjs"
          "$RELEASE_SMOKE_VERSION"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "$GITHUB_REPOSITORY"
          "$RESULTS_ROOT"
          "$REPOSITORY_ROOT"
          "$RESULT_BRANCH"
          "release"
          "${{ github.sha }}"
          "$RESULT_SUMMARY"

      - name: Commit the result branch
        id: commit
        working-directory: ${{ env.REPOSITORY_ROOT }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$RESULT_BRANCH"
          git add website/content/release-smoke website/public/release-smoke
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "docs(release-smoke): record Drever $RELEASE_SMOKE_VERSION"
          remote_sha="$(git ls-remote --heads origin "$RESULT_BRANCH" | cut -f1)"
          git push \
            --force-with-lease="refs/heads/$RESULT_BRANCH:$remote_sha" \
            origin \
            "HEAD:refs/heads/$RESULT_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the immutable Cloudflare Pages preview
        if: steps.commit.outputs.changed == 'true'
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          echo "origin=$(
          node "$AUTOMATION_ROOT/scripts/release-smoke/resolve-pages-preview.mjs"
          "$GITHUB_REPOSITORY"
          "${{ steps.commit.outputs.sha }}"
          )" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable deck deployment
        if: steps.commit.outputs.changed == 'true'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/verify-pages-preview.mjs"
          "${{ steps.pages.outputs.origin }}"
          "https://${RESULT_BRANCH}.drever-website.pages.dev"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "${{ github.sha }}"
          "${{ steps.pages.outputs.origin }}"

      - name: Pin the result to the immutable preview
        if: steps.commit.outputs.changed == 'true'
        id: pin
        working-directory: ${{ env.REPOSITORY_ROOT }}
        run: |
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-preview-origin.mjs" \
            "$REPOSITORY_ROOT" \
            "${{ github.run_id }}" \
            "$RESULT_BRANCH" \
            "${{ steps.pages.outputs.origin }}" \
            "$RESULT_SUMMARY"
          git add website/content/release-smoke website/public/release-smoke
          git commit -m "docs(release-smoke): pin immutable preview"
          git push origin "HEAD:refs/heads/$RESULT_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve the immutable report preview
        if: steps.commit.outputs.changed == 'true'
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          echo "origin=$(
          node "$AUTOMATION_ROOT/scripts/release-smoke/resolve-pages-preview.mjs"
          "$GITHUB_REPOSITORY"
          "${{ steps.pin.outputs.sha }}"
          )" >> "$GITHUB_OUTPUT"

      - name: Verify the immutable report deployment
        if: steps.commit.outputs.changed == 'true'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/verify-pages-preview.mjs"
          "${{ steps.report.outputs.origin }}"
          "${{ steps.pages.outputs.origin }}"
          "${{ github.run_id }}"
          "$RELEASE_SMOKE_VERSION"
          "$RELEASE_SMOKE_SOURCE_COMMIT"
          "${{ github.sha }}"

      - name: Pin the review report link
        if: steps.commit.outputs.changed == 'true'
        run: >
          node "$AUTOMATION_ROOT/scripts/release-smoke/pin-report-link.mjs"
          "$RESULT_SUMMARY"
          "${{ steps.pages.outputs.origin }}"
          "${{ steps.report.outputs.origin }}"

      - name: Publish the review summary
        if: steps.commit.outputs.changed == 'true'
        run: |
          cat "$RESULT_SUMMARY" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "- Result branch: [\`$RESULT_BRANCH\`](https://github.com/$GITHUB_REPOSITORY/tree/$RESULT_BRANCH)" >> "$GITHUB_STEP_SUMMARY"
