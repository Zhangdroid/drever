name: Publish npm release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: npm release channel
        required: true
        default: commit
        type: choice
        options:
          - commit
          - next
          - latest
      version:
        description: SemVer for next/latest with a matching CHANGELOG.md section; empty for commit
        required: false
        type: string
      ai_smoke:
        description: Run the post-release AI user journeys
        required: true
        default: auto
        type: choice
        options:
          - auto
          - always
          - never

permissions:
  contents: read

concurrency:
  group: npm-publish
  queue: max

jobs:
  audit:
    name: Audit release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      source-commit: ${{ steps.source.outputs.commit }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record the release source
        id: source
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: 24.18.0
          cache: false
          run-install: false

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Plan the release
        id: release
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          plan="$(node scripts/release.mjs plan "$RELEASE_CHANNEL" "$GITHUB_SHA" "$RELEASE_VERSION")"
          echo "version=$(jq -r .version <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tag <<<"$plan")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$plan")" >> "$GITHUB_OUTPUT"

      - name: Validate the release changelog
        env:
          CHANGELOG_SECTION: ${{ inputs.channel == 'commit' && 'Unreleased' || steps.release.outputs.version }}
        run: node scripts/changelog.mjs extract "$CHANGELOG_SECTION" > "$RUNNER_TEMP/drever-release-notes.md"

      - name: Install Chromium
        run: vp exec playwright install --with-deps --no-shell chromium

      - name: Verify the source revision
        run: vp run ready

      - name: Apply the ephemeral release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: node scripts/release.mjs prepare "$RELEASE_VERSION"

      - name: Verify the versioned release
        run: vp run release:check

      - name: Pack the release
        run: node scripts/release.mjs pack "$RUNNER_TEMP/drever-release"

      - name: Add the audited release notes
        run: cp "$RUNNER_TEMP/drever-release-notes.md" "$RUNNER_TEMP/drever-release/release-notes.md"

      - name: Retain the audited release
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drever-${{ steps.release.outputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/drever-release
          retention-days: 30

      - name: Verify npm publication locally
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/release.mjs publish "$RUNNER_TEMP/drever-release/release.json" "$RELEASE_TAG" --dry-run

  publish:
    name: Publish to npm
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
      deployment: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.audit.outputs.source-commit }}

      - name: Configure npm for trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download the audited tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact-id }}
          path: ${{ runner.temp }}/drever-release

      - name: Publish the audited tarballs
        env:
          RELEASE_TAG: ${{ needs.audit.outputs.tag }}
        run: node scripts/release.mjs publish "$RUNNER_TEMP/drever-release/release.json" "$RELEASE_TAG"

      - name: Verify the public registry release
        env:
          RELEASE_TAG: ${{ needs.audit.outputs.tag }}
          RELEASE_VERSION: ${{ needs.audit.outputs.version }}
        run: node scripts/verify-published.mjs "$RELEASE_VERSION" "$RELEASE_TAG"

  record:
    name: Create GitHub release
    needs: [audit, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download the audited release receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact-id }}
          path: ${{ runner.temp }}/drever-release

      - name: Record the completed npm release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.audit.outputs.source-commit }}
          RELEASE_PRERELEASE: ${{ needs.audit.outputs.prerelease }}
          RELEASE_TAG: ${{ needs.audit.outputs.tag }}
          RELEASE_VERSION: ${{ needs.audit.outputs.version }}
        run: |
          github_tag="v$RELEASE_VERSION"
          audited_notes="$RUNNER_TEMP/drever-release/release-notes.md"
          if [[ ! -s "$audited_notes" ]]; then
            echo "The audited release artifact does not contain release notes." >&2
            exit 1
          fi

          notes="$RUNNER_TEMP/drever-release-body.md"
          {
            cat "$audited_notes"
            echo
            echo "---"
            echo
            echo "### Release provenance"
            echo
            echo "- Version: \`$RELEASE_VERSION\`"
            echo "- npm dist-tag: \`$RELEASE_TAG\`"
            echo "- Source: [\`${RELEASE_COMMIT:0:12}\`](https://github.com/$GITHUB_REPOSITORY/commit/$RELEASE_COMMIT)"
            echo "- Package: [\`drever@$RELEASE_VERSION\`](https://www.npmjs.com/package/drever/v/$RELEASE_VERSION)"
          } > "$notes"

          if existing="$(gh release view "$github_tag" --repo "$GITHUB_REPOSITORY" --json body,isPrerelease 2>/dev/null)"; then
            existing_prerelease="$(jq -r .isPrerelease <<<"$existing")"
            existing_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$github_tag" --jq .object.sha)"
            if [[ "$existing_prerelease" != "$RELEASE_PRERELEASE" || "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "GitHub release $github_tag does not match the audited npm release." >&2
              exit 1
            fi
            existing_notes="$(jq -r .body <<<"$existing")"
            expected_notes="$(cat "$notes")"
            if [[ "$existing_notes" == "$expected_notes" ]]; then
              echo "GitHub release $github_tag already records this npm release."
              exit 0
            fi
            gh release edit "$github_tag" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Drever $RELEASE_VERSION" \
              --notes-file "$notes"
            echo "Updated GitHub release $github_tag from the audited changelog."
            exit 0
          fi

          arguments=(
            "$github_tag"
            "$RUNNER_TEMP/drever-release/release.json#Audited release receipt"
            --repo "$GITHUB_REPOSITORY"
            --target "$RELEASE_COMMIT"
            --title "Drever $RELEASE_VERSION"
            --notes-file "$notes"
          )
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            arguments+=(--prerelease)
          fi
          gh release create "${arguments[@]}"

  smoke:
    name: Queue comparative AI release smoke
    needs: [audit, record]
    if: >
      inputs.ai_smoke == 'always' ||
      (inputs.ai_smoke == 'auto' && inputs.channel == 'latest')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch the post-release user journey
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.audit.outputs.source-commit }}
          RELEASE_VERSION: ${{ needs.audit.outputs.version }}
        run: |
          gh api \
            --method POST \
            "repos/$GITHUB_REPOSITORY/actions/workflows/release-smoke.yml/dispatches" \
            --raw-field ref=main \
            --field "inputs[version]=$RELEASE_VERSION" \
            --field "inputs[source_commit]=$RELEASE_COMMIT"
